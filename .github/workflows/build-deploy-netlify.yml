name: Build and deploy WebGPU variants

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    name: Build ${{ matrix.mode }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: webgpu-only
            artifact: eight-bot-webgpu-only
          - mode: webgpu-webgl
            artifact: eight-bot-webgpu-webgl

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ matrix.mode }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-${{ matrix.mode }}-
            Library-WebGL-
            Library-

      - name: Build ${{ matrix.mode }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.10f1
          targetPlatform: WebGL
          buildMethod: WebBuild.Build
          customParameters: -webMode ${{ matrix.mode }} -output build/${{ matrix.mode }}

      - name: Upload ${{ matrix.mode }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.mode }}

  deploy-netlify:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    needs: build-web

    steps:
      - name: Download WebGPU-only artifact
        uses: actions/download-artifact@v4
        with:
          name: eight-bot-webgpu-only
          path: site/webgpu-only

      - name: Download WebGPU/WebGL artifact
        uses: actions/download-artifact@v4
        with:
          name: eight-bot-webgpu-webgl
          path: site/webgpu-webgl

      - name: Create Netlify headers
        run: |
          cat > site/_headers <<'EOF'
          /webgpu-only/Build/*.data.br
            Content-Type: application/octet-stream
            Content-Encoding: br

          /webgpu-only/Build/*.framework.js.br
            Content-Type: application/javascript
            Content-Encoding: br

          /webgpu-only/Build/*.wasm.br
            Content-Type: application/wasm
            Content-Encoding: br

          /webgpu-only/Build/*.symbols.json.br
            Content-Type: application/json
            Content-Encoding: br

          /webgpu-webgl/Build/*.data.br
            Content-Type: application/octet-stream
            Content-Encoding: br

          /webgpu-webgl/Build/*.framework.js.br
            Content-Type: application/javascript
            Content-Encoding: br

          /webgpu-webgl/Build/*.wasm.br
            Content-Type: application/wasm
            Content-Encoding: br

          /webgpu-webgl/Build/*.symbols.json.br
            Content-Type: application/json
            Content-Encoding: br
          EOF

      - name: Create landing page
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>eight-bot Web builds</title>
              <style>
                body {
                  font-family: system-ui, sans-serif;
                  max-width: 720px;
                  margin: 4rem auto;
                  line-height: 1.6;
                }
                a {
                  font-size: 1.2rem;
                }
              </style>
            </head>
            <body>
              <h1>eight-bot Web builds</h1>
              <ul>
                <li><a href="./webgpu-only/">WebGPU only</a></li>
                <li><a href="./webgpu-webgl/">WebGPU + WebGL fallback</a></li>
              </ul>
            </body>
          </html>
          EOF

      - name: Deploy to Netlify
        run: |
          npm install -g netlify-cli
          netlify deploy \
            --prod \
            --dir site \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
