name: Build and deploy WebGPU variants to Vercel

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    name: Build ${{ matrix.mode }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: webgpu-only
            artifact: eight-bot-webgpu-only
          - mode: webgpu-webgl
            artifact: eight-bot-webgpu-webgl

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ matrix.mode }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-${{ matrix.mode }}-
            Library-WebGL-
            Library-

      - name: Build ${{ matrix.mode }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.10f1
          targetPlatform: WebGL
          buildMethod: WebBuild.Build
          customParameters: -webMode ${{ matrix.mode }} -output build/${{ matrix.mode }}

      - name: Upload ${{ matrix.mode }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.mode }}

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build-web

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Download WebGPU-only artifact
        uses: actions/download-artifact@v4
        with:
          name: eight-bot-webgpu-only
          path: site/webgpu-only

      - name: Download WebGPU/WebGL artifact
        uses: actions/download-artifact@v4
        with:
          name: eight-bot-webgpu-webgl
          path: site/webgpu-webgl

      - name: Create Vercel config
        run: |
          cat > site/vercel.json <<'EOF'
          {
            "buildCommand": null,
            "installCommand": null,
            "outputDirectory": ".",
            "headers": [
              {
                "source": "/(.*)",
                "headers": [
                  {
                    "key": "X-Content-Type-Options",
                    "value": "nosniff"
                  },
                  {
                    "key": "Referrer-Policy",
                    "value": "strict-origin-when-cross-origin"
                  },
                  {
                    "key": "Permissions-Policy",
                    "value": "accelerometer=(), ambient-light-sensor=(), camera=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
                  }
                ]
              },
              {
                "source": "/webgpu-only/Build/(.*)\\.data\\.br",
                "headers": [
                  { "key": "Content-Type", "value": "application/octet-stream" },
                  { "key": "Content-Encoding", "value": "br" }
                ]
              },
              {
                "source": "/webgpu-only/Build/(.*)\\.framework\\.js\\.br",
                "headers": [
                  { "key": "Content-Type", "value": "application/javascript" },
                  { "key": "Content-Encoding", "value": "br" }
                ]
              },
              {
                "source": "/webgpu-only/Build/(.*)\\.wasm\\.br",
                "headers": [
                  { "key": "Content-Type", "value": "application/wasm" },
                  { "key": "Content-Encoding", "value": "br" }
                ]
              },
              {
                "source": "/webgpu-only/Build/(.*)\\.symbols\\.json\\.br",
                "headers": [
                  { "key": "Content-Type", "value": "application/json" },
                  { "key": "Content-Encoding", "value": "br" }
                ]
              },
              {
                "source": "/webgpu-webgl/Build/(.*)\\.data\\.br",
                "headers": [
                  { "key": "Content-Type", "value": "application/octet-stream" },
                  { "key": "Content-Encoding", "value": "br" }
                ]
              },
              {
                "source": "/webgpu-webgl/Build/(.*)\\.framework\\.js\\.br",
                "headers": [
                  { "key": "Content-Type", "value": "application/javascript" },
                  { "key": "Content-Encoding", "value": "br" }
                ]
              },
              {
                "source": "/webgpu-webgl/Build/(.*)\\.wasm\\.br",
                "headers": [
                  { "key": "Content-Type", "value": "application/wasm" },
                  { "key": "Content-Encoding", "value": "br" }
                ]
              },
              {
                "source": "/webgpu-webgl/Build/(.*)\\.symbols\\.json\\.br",
                "headers": [
                  { "key": "Content-Type", "value": "application/json" },
                  { "key": "Content-Encoding", "value": "br" }
                ]
              }
            ]
          }
          EOF

      - name: Create landing page
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>eight-bot Web builds</title>
              <style>
                body {
                  font-family: system-ui, sans-serif;
                  max-width: 720px;
                  margin: 4rem auto;
                  line-height: 1.6;
                }
                a {
                  font-size: 1.2rem;
                }
              </style>
            </head>
            <body>
              <h1>eight-bot Web builds</h1>
              <ul>
                <li><a href="./webgpu-only/">WebGPU only</a></li>
                <li><a href="./webgpu-webgl/">WebGPU + WebGL fallback</a></li>
              </ul>
            </body>
          </html>
          EOF

      - name: Deploy to Vercel
        run: |
          npm install -g vercel@latest
          cd site
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel deploy --prod --yes --token "$VERCEL_TOKEN"
