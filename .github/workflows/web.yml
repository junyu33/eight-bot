# .github/workflows/web.yml

name: Build WebGPU variants

on:
  push:
  pull_request:
    branches:
      - principale
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    name: Build ${{ matrix.mode }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: webgpu-only
            artifact: eight-bot-webgpu-only
          - mode: webgpu-webgl
            artifact: eight-bot-webgpu-webgl

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-WebGL-${{ matrix.mode }}-${{ hashFiles('Assets/**', 'Packages/**',
            'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-${{ matrix.mode }}-
            Library-WebGL-
            Library-

      - name: Build ${{ matrix.mode }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.10f1
          targetPlatform: WebGL
          buildMethod: WebBuild.Build
          customParameters: -webMode ${{ matrix.mode }} -output build/${{ matrix.mode }}

      - name: Upload ${{ matrix.mode }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.mode }}
